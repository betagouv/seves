{% extends "core/base.html" %}
{% load static waffle_tags %}

{% block base_override %}
    <link rel="stylesheet" href="{% static 'tiac/base.css' %}"/>
{% endblock %}

{% block product_nav %}
    <li class="btn-add-group fr-my-auto">
        <nav role="navigation" class="fr-translate fr-nav">
            <div class="fr-nav__item">
                <button class="fr-translate__btn fr-btn fr-btn--header-blue" aria-controls="translate-1"
                        aria-expanded="false" title="Sélectionner un type de fiche a créer">Créer un événement</button>
                <div class="fr-collapse fr-translate__menu fr-menu" id="translate-1">
                    <ul class="fr-menu__list">
                        <li><a class="fr-translate__language fr-nav__link" href="{% url 'tiac:evenement-simple-creation' %}">Enregistrement simple</a></li>
                        <li><a class="fr-translate__language fr-nav__link" href="{% url 'tiac:investigation-tiac-creation' %}">Investigation de TIAC</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </li>
    <li>
        <a class="fr-btn {% block highlight_menu_evenements %}{% endblock %}" href="{% url 'tiac:evenement-liste' %}">Liste des événements</a>
    </li>
    <li class="fr-nav__item">
        <button class="fr-nav__btn fr-btn stats-link" aria-expanded="false" aria-controls="menu-stats">Statistiques</button>
        <div class="fr-collapse fr-menu" id="menu-stats">
            <ul class="fr-menu__list">
                <li class="fr-nav__link"><a href="{% url 'ssa:stats-evenement' %}">Événements</a></li>
                <li class="fr-nav__link"><a href="{% url 'ssa:stats-activite' %}">Mesure d'activité</a></li>
            </ul>
        </div>
    </li>
{% endblock product_nav %}
